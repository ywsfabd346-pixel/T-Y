 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ساعة تحفة - نسخة معدلة</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#050505;background-image:radial-gradient(circle at 50% 30%, #2a2a2a, #000);
    font-family:Arial, sans-serif;padding:15px;
  }
  /* الدائرة الكبيرة */
  .clock-wrap{
    width:430px;height:430px;max-width:96vw;max-height:96vw;
    position:relative;border-radius:50%;flex-shrink:0;
    background:radial-gradient(circle at 50% 35%, #1c1c1c, #000);
    border:12px solid #c9a227;
    box-shadow:0 0 0 4px #000, 0 0 0 9px #8a6d1a, 0 0 60px rgba(201,162,39,.55), inset 0 0 50px rgba(0,0,0,.85);
    overflow:hidden;
  }
  .clock-wrap::before{content:"";position:absolute;inset:14px;border:1px solid rgba(201,162,39,.55);border-radius:50%}

  /* ارقام رومانية */
  .num{position:absolute;color:#d4af37;font-weight:bold;font-size:30px;transform:translate(-50%,-50%);text-shadow:0 0 10px rgba(212,175,55,.7)}
  .n12{top:7%;left:50%}.n3{top:50%;left:92%}.n6{top:93%;left:50%}.n9{top:50%;left:8%}
  .n1{top:15%;left:76%}.n2{top:29%;left:88%}.n4{top:71%;left:88%}.n5{top:85%;left:76%}
  .n7{top:85%;left:24%}.n8{top:71%;left:12%}.n10{top:29%;left:12%}.n11{top:15%;left:24%}

  .brand{position:absolute;top:19%;left:50%;transform:translateX(-50%);color:#c9a227;font-size:12px;letter-spacing:5px;white-space:nowrap}

  /* العقارب - المركز في النص بالظبط */
  .hand{position:absolute;left:50%;bottom:50%;transform-origin:bottom center;border-radius:10px;z-index:3}
  #hour{width:8px;height:20%;background:linear-gradient(#ffe27a,#c9a227);margin-left:-4px}
  #minute{width:6px;height:29%;background:linear-gradient(#fff,#d4af37);margin-left:-3px}
  #second{width:2.5px;height:34%;background:#ff2d2d;margin-left:-1.25px}
  .center-dot{position:absolute;top:50%;left:50%;width:18px;height:18px;background:#c9a227;border:3px solid #fff;border-radius:50%;transform:translate(-50%,-50%);z-index:4;box-shadow:0 0 12px gold}

  /* الشاشة الرقمية - في النصف التحتاني فقط ومثبتة في النص */
  .digital-box{
    position:absolute;top:60%;left:50%;transform:translateX(-50%);
    width:62%;text-align:center;z-index:2;
    background:rgba(0,18,28,.95);border:2px solid #c9a227;border-radius:14px;
    padding:10px 8px 8px;box-shadow:0 0 22px rgba(0,200,255,.45), inset 0 0 16px rgba(0,200,255,.2);
  }
  #digital-time{
    font-size:34px;font-weight:900;color:#00e5ff;letter-spacing:1px;
    text-shadow:0 0 16px #00e5ff;font-family:'Courier New',monospace;
    white-space:nowrap;line-height:1.1;
  }
  #digital-date{font-size:14px;color:#00e5ff;margin-top:5px;white-space:nowrap}
  #digital-day{font-size:13px;color:#ffd700;margin-top:3px;letter-spacing:3px}
  .footer{position:absolute;bottom:5.5%;left:50%;transform:translateX(-50%);color:#888;font-size:10px;letter-spacing:2px;white-space:nowrap}
</style>
</head>
<body>

<div class="clock-wrap">
  <div class="brand">MASTERPIECE</div>

  <span class="num n12">XII</span><span class="num n1">I</span><span class="num n2">II</span>
  <span class="num n3">III</span><span class="num n4">IIII</span><span class="num n5">V</span>
  <span class="num n6">VI</span><span class="num n7">VII</span><span class="num n8">VIII</span>
  <span class="num n9">IX</span><span class="num n10">X</span><span class="num n11">XI</span>

  <div class="hand" id="hour"></div>
  <div class="hand" id="minute"></div>
  <div class="hand" id="second"></div>
  <div class="center-dot"></div>

  <!-- النصف التحتاني كله للرقمية -->
  <div class="digital-box">
    <div id="digital-time">00:00:00</div>
    <div id="digital-date">-- / -- / ----</div>
    <div id="digital-day">---</div>
  </div>

  <div class="footer">SHENDI • SUDAN</div>
</div>

<script>
function updateClock(){
  const now = new Date();
  let h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();

  document.getElementById('hour').style.transform = `rotate(${(h%12)*30 + m*0.5}deg)`;
  document.getElementById('minute').style.transform = `rotate(${m*6 + s*0.1}deg)`;
  document.getElementById('second').style.transform = `rotate(${s*6}deg)`;

  let ampm = h >= 12 ? 'PM' : 'AM';
  let h12 = h % 12 || 12;
  document.getElementById('digital-time').textContent =
    String(h12).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0') + ' ' + ampm;

  const days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  document.getElementById('digital-day').textContent = days[now.getDay()];
  document.getElementById('digital-date').textContent = now.getDate() + ' / ' + (now.getMonth()+1) + ' / ' + now.getFullYear();
}
setInterval(updateClock, 1000);
updateClock();
</script>
</body>
</html>
<div style="text-align:center;color:gold;font-weight:bold;padding:20px">Made in TechnyYoussif</div>
